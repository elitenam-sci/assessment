<title>서·논술 대비 복습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 홈(영역 카드 3개) → 영역별 4단계 탭(개념·활동·퀴즈·서술) → 결과 확인. 태블릿 터치 우선, 단일 칼럼 880px */
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --ink:#16282C; --muted:#56696E; --line:#D3E1E4;
  --accent:#0E8A9B; --accent-ink:#FFFFFF; --accent-soft:#E0F2F4;
  --leaf:#2D8A55; --leaf-soft:#E3F3E9; --amber:#AE6A0C; --amber-soft:#FAEFD9; --sky:#2E6BB0; --sky-soft:#E3EDF8;
  --ok:#1E8549; --ok-soft:#E2F3E8; --bad:#C0392F; --bad-soft:#FBE6E4;
  --f-display:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E181A; --surface:#162326; --ink:#E3EDEF; --muted:#9BB0B4; --line:#2A3C40;
  --accent:#3BBFCF; --accent-ink:#05272C; --accent-soft:#163338;
  --leaf:#5DC28B; --leaf-soft:#163024; --amber:#E7A748; --amber-soft:#33271A; --sky:#71A7E6; --sky-soft:#192A3D;
  --ok:#5DC28B; --ok-soft:#163024; --bad:#EF7F77; --bad-soft:#3A1E1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181A; --surface:#162326; --ink:#E3EDEF; --muted:#9BB0B4; --line:#2A3C40;
  --accent:#3BBFCF; --accent-ink:#05272C; --accent-soft:#163338;
  --leaf:#5DC28B; --leaf-soft:#163024; --amber:#E7A748; --amber-soft:#33271A; --sky:#71A7E6; --sky-soft:#192A3D;
  --ok:#5DC28B; --ok-soft:#163024; --bad:#EF7F77; --bad-soft:#3A1E1C; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.area{background:var(--a);border-color:var(--a);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;padding:0 10px}

/* 홈 */
.hero{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.hero h1{font-size:28px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left}
.acard .tag{align-self:flex-start;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--a);background:var(--a-soft);padding:3px 10px;border-radius:999px}
.acard h2{font-size:21px}
.acard .desc{font-size:15px;color:var(--muted);flex:1}
.pips{display:flex;gap:6px}
.pip{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-align:center}
.pip i{display:block;height:6px;border-radius:3px;background:var(--line)}
.pip.on i{background:var(--a)}
.pip.on{color:var(--ink)}
.section-title{font-size:19px;margin:30px 0 12px}

/* 표 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--accent-soft);color:var(--ink);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.c,th.c{text-align:center}
.num{font-variant-numeric:tabular-nums}

/* 영역 화면 */
.area-head{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.area-head .tag{color:var(--a);font-weight:700;font-size:14px}
.area-head h1{font-size:26px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:20px}
.tab{border:none;background:transparent;border-radius:10px;min-height:48px;font-weight:700;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:var(--a);color:var(--surface)}
.tab .ck{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:19px}
.card.soft{background:var(--a-soft);border-color:transparent}
.key{border-left:6px solid var(--a);background:var(--surface);border-radius:0 12px 12px 0;padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.formula{font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.formula .box{background:var(--a-soft);padding:6px 12px;border-radius:10px}
.next-row{display:flex;justify-content:flex-end;margin-top:20px;gap:10px;flex-wrap:wrap}

/* 그래프 */
.graph{display:flex;flex-direction:column;gap:6px}
.graph svg{width:100%;height:auto;max-width:100%}
.graph .gt{font-weight:700;font-size:15px}
.graph .gd{font-size:14px;color:var(--muted)}

/* 퀴즈 */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.q .qt{font-weight:700;display:flex;gap:10px}
.q .qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--a);color:var(--surface);display:grid;place-items:center;font-size:14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--a)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:10px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ink)}
.fb.no{background:var(--bad-soft);color:var(--ink)}
.fb b{margin-right:6px}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}

/* 설탕 표 선택 */
.task-tabs{display:flex;gap:8px;flex-wrap:wrap}
.task-tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px;min-height:40px}
.task-tab[aria-pressed="true"]{border-color:var(--a);background:var(--a-soft);color:var(--a)}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--a-soft)}
tr.pick.sel td{background:var(--a-soft);font-weight:700}
tr.pick td:first-child{white-space:nowrap}
.box-ck{display:inline-grid;place-items:center;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;margin-right:8px;vertical-align:-5px;font-size:13px;color:var(--surface)}
tr.sel .box-ck{background:var(--a);border-color:var(--a)}

/* 체 시뮬레이션 */
.sieve{position:relative;background:var(--a-soft);border-radius:var(--r);padding:16px 16px 120px;overflow:hidden}
.grains{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;min-height:120px;flex-wrap:wrap}
.grain{display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .9s ease,opacity .9s ease}
.grain .dot{border-radius:50%;background:var(--a);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px}
.grain .dot.split{background:transparent}
.grain .dot.split span{display:block;border-radius:50%;background:var(--a)}
.grain .lb{font-size:14px;font-weight:700;white-space:nowrap}
.grain .st{font-size:13px;color:var(--muted);min-height:20px}
.grain.pass{transform:translateY(118px)}
.mesh{height:14px;margin:10px 0 0;border-radius:4px;background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 14px);opacity:.7}
.mesh-label{position:absolute;left:16px;bottom:12px;font-size:13px;color:var(--muted)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap}

/* 매칭 */
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:90px 1fr 1fr;gap:10px;align-items:center}
.mrow .nm{font-weight:700}
select{font:inherit;font-size:16px;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 10px;width:100%;min-width:0}
select.right{border-color:var(--ok);background:var(--ok-soft)}
select.wrong{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}

/* 호흡 시뮬레이션 */
.breath{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:680px){.breath{grid-template-columns:1fr}}
.breath svg{width:100%;height:auto;max-width:100%;background:var(--a-soft);border-radius:var(--r)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .row{display:flex;justify-content:space-between;font-size:15px}
.meter .bar{position:relative;height:14px;border-radius:7px;background:var(--line);overflow:visible}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--a);transition:width .2s linear}
.meter .ref{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.legend{font-size:13px;color:var(--muted)}

/* 서술 */
textarea{width:100%;min-height:150px;font:inherit;font-size:17px;line-height:1.7;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw span{font-size:14px;padding:5px 12px;border-radius:999px;border:1.5px solid var(--line)}
.kw span.hit{border-color:var(--ok);background:var(--ok-soft)}
.kw span.miss{border-style:dashed;color:var(--muted)}
.model{background:var(--a-soft);border-radius:12px;padding:14px 16px}
.chk{display:flex;flex-direction:column;gap:8px}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.prompt{font-weight:700}
.data-note{font-size:14px;color:var(--muted)}

/* 결과 */
.field{display:flex;flex-direction:column;gap:6px;max-width:360px}
.field input{font:inherit;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 12px}
.done{color:var(--ok);font-weight:700}
.todo{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:700;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">서</span>서·논술 대비 복습</div>
    <div class="spacer"></div>
    <span class="chip" id="totalChip">0 / 12 단계</span>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';

/* ───────── 저장 ───────── */
var KEY='seo-nonsul-review-v1';
function blank(){return {name:'',p:{pho:{concept:false,act:false,quiz:null,write:false},dig:{concept:false,act:false,quiz:null,write:false},res:{concept:false,act:false,quiz:null,write:false}},drafts:{}};}
var S=blank();
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); if(o&&o.p){S=Object.assign(blank(),o);}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ───────── 영역 데이터 ───────── */
var AREAS={
 pho:{no:'①',title:'광합성과 변인 통제',color:'leaf',desc:'환경 요인과 광합성량의 관계, 비교할 수 있는 자료 고르기',points:'4점 · 1문항'},
 dig:{no:'②',title:'소화의 필요성',color:'amber',desc:'최종 분해 산물과 흡수, 크기를 수치로 비교하기',points:'5점 · 1문항'},
 res:{no:'③',title:'호흡 운동',color:'sky',desc:'갈비뼈·가로막의 움직임과 흉강 부피·압력·공기 이동',points:'5점 · 2문항'}
};
var ORDER=['pho','dig','res'];
var STEPS=[['concept','개념'],['act','활동'],['quiz','퀴즈'],['write','서술']];

var QUIZ={
 pho:[
  {q:'빛의 세기가 일정 범위 이상으로 강해지면 광합성량은 어떻게 될까?',o:['계속 증가한다','거의 일정해진다','급격히 감소한다','0이 된다'],a:1,e:'빛의 세기는 일정 범위까지는 광합성량을 증가시키지만, 그 이상에서는 광합성량이 거의 일정해진다.'},
  {q:'온도가 적정 온도보다 더 높아지면 광합성량은?',o:['계속 증가한다','변화가 없다','급격히 감소한다','일정해진다'],a:2,e:'온도는 적정 온도까지 광합성량을 증가시키지만, 그보다 높아지면 광합성량이 급격히 감소한다.'},
  {q:'온도가 광합성량에 미치는 영향을 알아보는 실험에서 빛의 세기는 어떤 변인일까?',o:['독립 변인','종속 변인','통제 변인'],a:2,e:'알아보려는 요인(온도)만 바꾸고, 결과에 영향을 줄 수 있는 빛의 세기는 같게 유지해야 하므로 통제 변인이다.'},
  {q:'결과에 미치는 영향을 알아보려고 일부러 다르게 하는 요인을 무엇이라고 할까?',o:['독립 변인','종속 변인','통제 변인'],a:0,e:'독립 변인은 실험자가 의도적으로 바꾸는 요인, 종속 변인은 그에 따라 측정하는 결과이다.'},
  {q:'어떤 요인의 영향을 확인하는 데 가장 알맞은 자료는?',o:['결과값이 가장 큰 자료','예상과 결과가 일치하는 자료','알아보려는 요인만 다르고 나머지 조건은 같은 자료','조건이 가장 많이 다른 자료'],a:2,e:'다른 조건까지 함께 달라지면 결과가 어떤 요인 때문인지 알 수 없다. 알아보려는 요인 하나만 달라야 한다.'}
 ],
 dig:[
  {q:'소화가 필요한 가장 중요한 까닭은?',o:['음식의 맛을 좋게 하려고','영양소를 세포막을 통과할 만큼 작게 분해하려고','음식을 오래 저장하려고','물을 흡수하려고'],a:1,e:'크고 복잡한 영양소는 세포막을 통과하지 못하므로, 흡수될 수 있을 만큼 작은 물질로 분해되어야 한다.'},
  {q:'단백질의 최종 분해 산물은?',o:['포도당','아미노산','지방산','엿당'],a:1,e:'단백질은 펩신, 트립신, 단백질 소화 효소에 의해 최종적으로 아미노산으로 분해된다.'},
  {q:'지방산과 모노글리세리드가 흡수되는 곳은?',o:['융털의 모세혈관','융털의 암죽관','위의 벽','큰창자'],a:1,e:'포도당·아미노산은 융털의 모세혈관으로, 지방산·모노글리세리드는 융털의 암죽관으로 흡수된다.'},
  {q:'체와 곡물 비유에서 "체의 구멍"에 해당하는 것은?',o:['소화 효소','작은창자 융털 표면 세포막의 통로','위','쓸개즙'],a:1,e:'구멍보다 작은 알갱이만 체를 통과하듯, 세포막 통로보다 작은 물질만 흡수된다.'},
  {q:'통로의 크기가 10일 때, 크기가 40인 물질 A와 8인 물질 B 중 통과할 수 있는 것은? (가상의 값)',o:['A만','B만','둘 다','둘 다 아니다'],a:1,e:'B(8)는 통로(10)보다 작아서 통과하고, A(40)는 통로(10)보다 커서 통과하지 못한다. 이처럼 수치를 직접 비교해 설명한다.'}

function checkSugar(){
  var T=TASKS[sugarTask], pick=Object.keys(sugarSel).filter(function(k){return sugarSel[k];}).sort();

  if(rows.length<2){fb.innerHTML='<p class="fb no"><b>다시!</b>비교하려면 실험을 두 개 이상 골라야 해요.</p>';return;}
  var diff=[];
  VARS.forEach(function(v,i){ if(i===T.target) return; var vals=rows.map(function(r){return r[i+1];}); if(vals.some(function(x){return x!==vals[0];})) diff.push(v);});
  var tv=rows.map(function(r){return r[T.target+1];});
  var distinct=tv.filter(function(x,i){return tv.indexOf(x)===i;}).length===tv.length;
  if(diff.length){fb.innerHTML='<p class="fb no"><b>다시!</b>고른 실험들은 '+VARS[T.target]+' 말고도 <b>'+diff.join(', ')+'</b>이(가) 서로 달라요. 이러면 결과가 어떤 요인 때문인지 알 수 없어요.</p>';return;}

  fb.innerHTML='<p class="fb ok"><b>✓</b>'+T.ok+'</p>';

}

function animateBreath(dir){
  var s=breathState; if(s.raf) cancelAnimationFrame(s.raf);
  var C=CONS[s.cons], tr=dir==='in'?C.rib:0, td=dir==='in'?C.dia:0;
  var r0=s.rib,d0=s.dia,a0=s.air||0, t0=null, dur=1600;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(t){
    if(t0===null) t0=t; var k=reduce?1:Math.min(1,(t-t0)/dur); var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

    var target=inc, lag=reduce?1:Math.min(1,(t-t0)/(dur+500));
    s.air=a0+(target-a0)*(lag<.5?2*lag*lag:1-Math.pow(-2*lag+2,2)/2);
    s.flow=(dir==='in'?1:-1)*Math.max(0,Math.abs(inc-s.air))*3+(k<1?(dir==='in'?0.3:-0.3)*(1-k):0);
    drawChest(); setMeters();
    if(k<1||lag<1) s.raf=requestAnimationFrame(step); else {s.flow=0; drawChest(); s.raf=0; afterBreath(dir);}
  }
  s.raf=requestAnimationFrame(step);
}
function afterBreath(dir){
  var s=breathState, fb=document.getElementById('breathFb'); if(!fb) return;
  if(dir==='out'){fb.innerHTML='날숨: 갈비뼈가 내려가고 가로막이 올라가 흉강 부피가 작아지면, 허파 내부 압력이 높아져 공기가 밖으로 나가요.';return;}
  var air=Math.round(((CONS[s.cons].rib+CONS[s.cons].dia)/2)*100);
  s.seen[s.cons]=true;
  if(s.cons==='none') fb.innerHTML='평소 들숨: 흉강 부피가 커짐 → 허파 내부 압력이 바깥보다 낮아짐 → 공기가 들어와요.';
  else fb.innerHTML='<b>'+CONS[s.cons].nm+'</b>: '+(s.cons==='A'?'갈비뼈가 충분히 올라가지 못해':'가로막이 충분히 내려가지 못해')+' 흉강 부피가 평소보다 덜 커지고, 허파 내부 압력이 덜 낮아져 들어온 공기가 평소의 약 '+air+'%로 줄었어요. (모형으로 나타낸 값)';
  if(s.seen.none&&s.seen.A&&s.seen.B&&!S.p.res.act){mark('res','act'); toast('활동 완료!'); refreshTabs();}
}

/* ───────── 퀴즈 ───────── */
var quizAns={};
function quizHTML(a){
  if(!quizAns[a]) quizAns[a]={};
  var qs=QUIZ[a], h='<div class="stack">';
  qs.forEach(function(q,i){
    var pick=quizAns[a][i];
    h+='<div class="q"><p class="qt"><span class="qn">'+(i+1)+'</span><span>'+q.q+'</span></p><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='';
      if(pick!==undefined){ if(j===q.a) cls=' right'; else if(j===pick) cls=' wrong'; }
      h+='<button class="opt'+cls+'" data-q="'+i+'" data-o="'+j+'"'+(pick!==undefined?' disabled':'')+'>'+o+'</button>';
    });
    h+='</div>';
    if(pick!==undefined) h+='<p class="fb '+(pick===q.a?'ok':'no')+'"><b>'+(pick===q.a?'정답!':'아쉬워요.')+'</b>'+q.e+'</p>';
    h+='</div>';
  });
  var n=Object.keys(quizAns[a]).length, right=qs.filter(function(q,i){return quizAns[a][i]===q.a;}).length;
  h+='<div class="card soft score"><div><span class="muted">'+(n<qs.length?'푼 문제 '+n+' / '+qs.length:'이번 점수')+'</span><div class="big">'+right+' / '+qs.length+'</div>'+(S.p[a].quiz!==null?'<span class="data-note">최고 기록 '+S.p[a].quiz+' / '+qs.length+'</span>':'')+'</div>'+(n===qs.length?'<button class="btn" data-quiz-retry>다시 풀기</button>':'')+'</div>';
  return h+'</div>';
}

/* ───────── 서술 ───────── */
function writeHTML(a){
  var W=WRITE[a], d=S.drafts[a]||'';
  var h='<div class="stack"><div class="card"><h3>서술 연습</h3><p class="prompt">'+W.prompt+'</p><p class="data-note">'+W.note+'</p>';
  h+='<label for="ta-'+a+'" class="muted" style="font-size:14px">나의 답안</label><textarea id="ta-'+a+'" data-ta="'+a+'" placeholder="원인 → 결과 순서로, 근거를 넣어 써 보세요.">'+esc(d)+'</textarea>';
  h+='<div class="ctrl"><button class="btn area" data-wcheck>답안 점검하기</button><span class="data-note" id="wcount" style="align-self:center">'+d.length+'자</span></div><div id="wfb"></div></div></div>';
  return h;
}
function writeCheck(a){
  var W=WRITE[a], txt=(S.drafts[a]||'').trim(), fb=document.getElementById('wfb');
  if(txt.length<20){fb.innerHTML='<p class="fb no"><b>조금 더!</b>20자 이상 써야 점검할 수 있어요. 지금 '+txt.length+'자예요.</p>';return;}
  var hits=W.kw.map(function(k){return k[1].some(function(w){return txt.indexOf(w)>=0;});});
  var n=hits.filter(Boolean).length;
  var h='<div class="stack"><div><p style="font-weight:700;margin-bottom:8px">핵심 요소 '+n+' / '+W.kw.length+'개가 들어 있어요</p><div class="kw">';
  W.kw.forEach(function(k,i){h+='<span class="'+(hits[i]?'hit':'miss')+'">'+(hits[i]?'✓ ':'')+k[0]+'</span>';});
  h+='</div><p class="data-note" style="margin-top:6px">낱말 포함 여부만 확인한 결과예요. 아래 예시 답안과 비교해 스스로 점검하세요.</p></div>';
  h+='<div class="model"><p style="font-weight:700;margin-bottom:6px">예시 답안</p><p>'+W.model+'</p></div>';
  h+='<div><p style="font-weight:700;margin-bottom:8px">스스로 점검</p><div class="chk">';
  W.chk.forEach(function(c,i){h+='<label><input type="checkbox" id="ck-'+a+'-'+i+'" data-wck> <span>'+c+'</span></label>';});
  h+='</div></div><div class="ctrl"><button class="btn area" data-wdone disabled>점검을 마쳤어요</button></div></div>';
  fb.innerHTML=h;
}

/* ───────── 결과 ───────── */
function resultHTML(){
  var h='<button class="btn ghost" data-page="home">← 처음으로</button><div class="area-head"><span class="tag" style="color:var(--accent)">학습 결과</span><h1>나의 복습 기록</h1></div>';
  h+='<div class="stack"><div class="field"><label for="stuName" style="font-weight:700">학번과 이름</label><input id="stuName" placeholder="예) 20315 홍길동" value="'+esc(S.name)+'"></div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>영역</th><th class="c">개념</th><th class="c">활동</th><th class="c">퀴즈 최고</th><th class="c">서술 점검</th></tr></thead><tbody>';
  ORDER.forEach(function(a){
    var p=S.p[a]; function c(v){return v?'<span class="done">완료</span>':'<span class="todo">—</span>';}
    h+='<tr><td><b>'+AREAS[a].title+'</b></td><td class="c">'+c(p.concept)+'</td><td class="c">'+c(p.act)+'</td><td class="c num">'+(p.quiz===null?'<span class="todo">—</span>':p.quiz+' / 5')+'</td><td class="c">'+c(p.write)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  var t=totalDone();
  h+='<div class="card soft score"><div><span class="muted">전체 진행</span><div class="big">'+t+' / 12 단계</div></div><span>'+(t===12?'모든 복습을 마쳤어요. 선생님께 이 화면을 보여 주세요.':'남은 단계를 마저 해 보세요.')+'</span></div>';
  h+='<div class="ctrl"><button class="btn primary" data-copy>결과 복사하기</button><button class="btn" data-reset>기록 초기화</button></div><div id="resetBox"></div></div>';
  return h;
}
function resultText(){
  var lines=['[서·논술 대비 복습] '+(S.name||'(이름 없음)')];
  ORDER.forEach(function(a){var p=S.p[a]; lines.push(AREAS[a].title+': 개념 '+(p.concept?'O':'X')+' / 활동 '+(p.act?'O':'X')+' / 퀴즈 '+(p.quiz===null?'-':p.quiz+'/5')+' / 서술 '+(p.write?'O':'X'));});
  lines.push('진행 '+totalDone()+'/12');
  return lines.join('\n');
}

/* ───────── 렌더 ───────── */
function render(){
  if(view.page==='home') app.innerHTML=homeHTML();
  else if(view.page==='area') app.innerHTML=areaHTML();
  else app.innerHTML=resultHTML();
  updateChip();
  if(view.page==='area'&&view.step==='act'&&view.area==='res'){drawChest(); setMeters();}
}
function renderStep(){
  if(breathState&&breathState.raf){cancelAnimationFrame(breathState.raf); breathState.raf=0;}
  document.getElementById('stepBody').innerHTML=stepHTML(view.area,view.step);
  refreshTabs();
  if(view.step==='act'&&view.area==='res'){drawChest(); setMeters();}
}
function refreshTabs(){
  var a=view.area; if(!a) return;
  document.querySelectorAll('.tab').forEach(function(t){
    var s=t.getAttribute('data-step'), i=STEPS.findIndex(function(x){return x[0]===s;});
    t.setAttribute('aria-selected',String(view.step===s));
    t.innerHTML=(i+1)+'. '+STEPS[i][1]+(stepDone(a,s)?' <span class="ck" aria-label="완료">✓</span>':'');
  });
  updateChip();
}

/* ───────── 이벤트 ───────── */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('button, tr.pick'); if(!t) return;
  var d=t.dataset;
  if(d.go){sugarSel={}; sugarTask=0; sieve=null; go('area',d.go,'concept'); return;}
  if(d.page){go(d.page); return;}
  if(d.step){view.step=d.step; renderStep(); window.scrollTo(0,0); return;}
  var a=view.area;
  if(t.hasAttribute('data-concept-done')){mark(a,'concept'); t.textContent='✓ 개념 확인 완료'; refreshTabs(); return;}
  // 설탕
  if(d.task!==undefined){sugarTask=+d.task; sugarSel={}; renderStep(); return;}
  if(t.matches('tr.pick')){toggleRow(t); return;}
  if(t.hasAttribute('data-sugar-check')){checkSugar(); return;}
  if(t.hasAttribute('data-sugar-reset')){sugarSel={}; renderStep(); return;}
  // 체
  if(t.hasAttribute('data-sift')){sieve.sifted=true; renderSieve(); if(sieve.grains[0].size<20){S.digSieve=true; digCheckDone();} return;}
  if(t.hasAttribute('data-crush')){var b=sieve.grains[0]; if(b.size>=20){b.size=b.size/2; b.pieces*=2; sieve.sifted=false; renderSieve();} return;}
  if(t.hasAttribute('data-sieve-reset')){sieve=newSieve(); renderSieve(); return;}
  if(t.hasAttribute('data-match-check')){
    var all=true;
    MATCH.forEach(function(m,i){
      var p=document.getElementById('mp'+i), s=document.getElementById('ms'+i);
      var okp=p.value===m[1], oks=s.value===m[2];
      p.className=p.value?(okp?'right':'wrong'):''; s.className=s.value?(oks?'right':'wrong'):'';
      if(!okp||!oks) all=false;
    });
    var fb=document.getElementById('matchFb');
    if(all){fb.innerHTML='<p class="fb ok"><b>✓</b>모두 맞았어요! 포도당·아미노산은 모세혈관으로, 지방산·모노글리세리드는 암죽관으로 흡수돼요.</p>'; S.digMatch=true; digCheckDone();}
    else fb.innerHTML='<p class="fb no"><b>다시!</b>빨간 칸을 고쳐 보세요. 개념 탭의 표를 다시 봐도 좋아요.</p>';
    return;
  }
  // 호흡
  if(d.cons){breathState.cons=d.cons; breathState.rib=0; breathState.dia=0; breathState.air=0; breathState.flow=0; if(breathState.raf){cancelAnimationFrame(breathState.raf);breathState.raf=0;}
    document.querySelectorAll('[data-cons]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.cons===d.cons));});
    document.getElementById('consNote').textContent=consNote(d.cons); document.getElementById('breathFb').textContent=''; drawChest(); setMeters(); return;}
  if(d.breath){animateBreath(d.breath); return;}
  // 퀴즈
  if(d.q!==undefined&&d.o!==undefined){
    quizAns[a][+d.q]=+d.o;
    var qs=QUIZ[a];
    if(Object.keys(quizAns[a]).length===qs.length){
      var right=qs.filter(function(q,i){return quizAns[a][i]===q.a;}).length;
      var first=S.p[a].quiz===null;
      if(first||right>S.p[a].quiz) mark(a,'quiz',right);
      if(first) toast('퀴즈 완료! '+right+' / '+qs.length);
    }
    var y=window.scrollY; renderStep(); window.scrollTo(0,y); return;
  }
  if(t.hasAttribute('data-quiz-retry')){quizAns[a]={}; renderStep(); window.scrollTo(0,0); return;}
  // 서술
  if(t.hasAttribute('data-wcheck')){writeCheck(a); return;}
  if(t.hasAttribute('data-wdone')){mark(a,'write'); t.textContent='✓ 서술 연습 완료'; t.disabled=true; refreshTabs(); toast('서술 연습 완료!'); return;}
  // 결과
  if(t.hasAttribute('data-copy')){
    var txt=resultText();
    var done=function(){toast('결과를 복사했어요');};
    try{navigator.clipboard.writeText(txt).then(done,function(){showCopy(txt);});}catch(e){showCopy(txt);}
    return;
  }
  if(t.hasAttribute('data-reset')){document.getElementById('resetBox').innerHTML='<div class="card soft"><p>모든 진행 기록과 답안이 지워져요. 정말 초기화할까요?</p><div class="ctrl"><button class="btn primary" data-reset-yes>초기화</button><button class="btn" data-reset-no>취소</button></div></div>'; return;}
  if(t.hasAttribute('data-reset-yes')){S=blank(); quizAns={}; save(); go('result'); toast('기록을 초기화했어요'); return;}
  if(t.hasAttribute('data-reset-no')){document.getElementById('resetBox').innerHTML=''; return;}
});
function showCopy(txt){
  var box=document.getElementById('resetBox');
  box.innerHTML='<div class="card soft"><p class="data-note">자동 복사가 막혀 있어요. 아래 글을 길게 눌러 복사하세요.</p><textarea id="copyArea" readonly style="min-height:120px">'+esc(txt)+'</textarea></div>';
  var ta=document.getElementById('copyArea'); ta.focus(); ta.select();
}
function toggleRow(tr){var k=tr.dataset.row; sugarSel[k]=!sugarSel[k]; var y=window.scrollY; renderStep(); window.scrollTo(0,y); var n=document.querySelector('tr[data-row="'+k+'"]'); if(n) n.focus({preventScroll:true});}
document.addEventListener('keydown',function(ev){
  var tr=ev.target.closest&&ev.target.closest('tr.pick');
  if(tr&&(ev.key===' '||ev.key==='Enter')){ev.preventDefault(); toggleRow(tr);}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.ta){S.drafts[t.dataset.ta]=t.value; save(); var c=document.getElementById('wcount'); if(c) c.textContent=t.value.length+'자';}
  if(t.id==='stuName'){S.name=t.value; save();}
});
document.addEventListener('change',function(ev){
  if(ev.target.matches('[data-wck]')){
    var all=Array.prototype.every.call(document.querySelectorAll('[data-wck]'),function(c){return c.checked;});
    var b=document.querySelector('[data-wdone]'); if(b&&!S.p[view.area].write) b.disabled=!all;
  }
});

render();
})();
</script>
